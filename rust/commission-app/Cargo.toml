[package]
name = "commission-app"
description = "CommissionApp — the whole web app in Rust (WebAssembly)"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
commission-core = { path = "../commission-core" }
regex = { version = "1", default-features = false, features = ["std", "perf"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
calamine = { version = "0.38", default-features = false }
rust_xlsxwriter = { version = "0.102", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# "wasm": the file date comes from the browser clock (std::time does not work in the browser)
rust_xlsxwriter = { version = "0.102", default-features = false, features = ["wasm"] }
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "Window", "Document", "Element", "HtmlElement", "HtmlInputElement", "HtmlSelectElement", "HtmlButtonElement",
  "HtmlAnchorElement", "Node", "NodeList", "DomTokenList", "CssStyleDeclaration", "Event", "EventTarget",
  "KeyboardEvent", "DragEvent", "DataTransfer", "FileList", "File", "Blob", "BlobPropertyBag", "Url", "Storage",
  "Response", "RequestInit", "AbortController", "AbortSignal", "Headers", "console",
] }
